<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111318"><title>VOCLOOP</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#f8fafc;background:#111318}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.app{max-width:520px;margin:auto;min-height:100dvh;padding:18px 16px calc(90px + env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}h1{font-size:23px;margin:0;letter-spacing:.7px}h1 span,.blue{color:#60a5fa}h2{font-size:21px;margin:8px 0 16px}h3{font-size:16px;margin:0 0 12px}.muted{color:#aeb8c7}.small{font-size:12px}.card{background:#20242c;border:1px solid #353c49;border-radius:16px;padding:17px;margin-bottom:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{text-align:center;padding:14px 5px}.stat strong{display:block;font-size:24px}.stat small{font-size:11px;color:#aeb8c7}.btn{border:0;border-radius:12px;padding:13px 15px;color:white;background:#2563eb;font-weight:650}.btn.secondary{background:#343c4a}.btn.ghost{background:transparent;border:1px solid #566070}.btn.danger{background:#883b48}.btn.block{width:100%;margin-top:10px}.btnrow{display:flex;gap:8px}.btnrow>*{flex:1}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:520px;width:100%;display:grid;grid-template-columns:repeat(4,1fr);background:#1c2027;border-top:1px solid #353c49;padding:9px 0 calc(9px + env(safe-area-inset-bottom));z-index:5}.nav button{border:0;background:transparent;color:#aeb8c7;font-size:12px;padding:5px}.nav button.active{color:#60a5fa;font-weight:700}.nav b{display:block;font-size:21px;margin-bottom:3px}input,textarea,select{width:100%;border:1px solid #465060;border-radius:11px;background:#151a22;color:white;padding:12px;margin:5px 0 13px}textarea{min-height:110px}label{display:block;font-size:13px;color:#cbd5e1}.word{font-size:30px;font-weight:750;overflow-wrap:anywhere}.flip{min-height:240px;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;gap:14px;cursor:pointer}.meaning{font-size:23px;font-weight:700}.pill{font-size:11px;padding:5px 8px;background:#353e4e;border-radius:9px;color:#d4e4ff}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.row .grow{flex:1;min-width:0}.row strong{overflow-wrap:anywhere}.list-item{border-bottom:1px solid #353c49;padding:13px 0}.list-item:last-child{border:0}.bar{height:12px;background:#333a45;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#2563eb}.chart{display:flex;align-items:end;gap:7px;height:120px}.chart>div{flex:1;text-align:center;font-size:10px;color:#aeb8c7}.chart i{display:block;background:#2563eb;border-radius:5px 5px 0 0;min-height:3px}.notice{border-left:3px solid #60a5fa;padding:10px;background:#1d2b40;border-radius:5px;margin-bottom:12px}.error{color:#fca5a5;white-space:pre-wrap}.ok{color:#86efac;white-space:pre-wrap}.hide{display:none}.section{margin:24px 0 12px}.toggle{width:auto;accent-color:#2563eb}hr{border:0;border-top:1px solid #353c49;margin:18px 0}
</style></head><body><main class="app"><header><h1>VOC<span>LOOP</span></h1><span class="muted small">Vocabulary × Loop</span></header><div id="view"></div></main><nav class="nav" id="nav"></nav><script>
'use strict';const DAY=86400000,DBNAME='vocloop-db',VERSION=1;let db,state,screen='home',session=null,flipped=false,lastUndo=null,importDraft=null,editing=null;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const jid=d=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);const today=()=>jid(new Date());const addDays=(s,n)=>{const d=new Date(s+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};const id=()=>crypto.randomUUID?.()||Date.now()+'-'+Math.random();const defaults=()=>({schema:1,words:[],logs:[],settings:{advance:'instant',reminder:true,lastBackup:null},session:null});function request(req){return new Promise((resolve,reject)=>{req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}async function init(){db=await new Promise((resolve,reject)=>{let r=indexedDB.open(DBNAME,VERSION);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('app'))r.result.createObjectStore('app')};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});state=await request(db.transaction('app').objectStore('app').get('state'))||defaults();session=state.session;render()}async function save(){return new Promise((resolve,reject)=>{let tx=db.transaction('app','readwrite');tx.objectStore('app').put(state,'state');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}const active=()=>state.words.filter(w=>!w.archived);const due=()=>active().filter(w=>w.started&&w.due<=today()).sort((a,b)=>(a.stage-b.stage)||(a.due.localeCompare(b.due)));const newWords=()=>active().filter(w=>!w.started).sort((a,b)=>(b.priority==='優先')-(a.priority==='優先')||a.created.localeCompare(b.created));const newToday=()=>new Set(state.logs.filter(l=>l.kind==='initial'&&l.isNew&&l.date===today()).map(l=>l.wordId)).size;const mastered=w=>w.mastered===true;const countMastered=()=>active().filter(mastered).length;const logCount=date=>new Set(state.logs.filter(l=>l.date===date&&l.kind==='initial').map(l=>l.wordId)).size;
function nav(){let arr=[['home','⌂','ホーム'],['words','▤','単語帳'],['analysis','▥','分析'],['settings','⚙','設定']];$('#nav').innerHTML=arr.map(([k,ico,label])=>`<button class="${screen===k?'active':''}" data-nav="${k}"><b>${ico}</b>${label}</button>`).join('')}function render(){nav();const v=$('#view');if(screen==='home')v.innerHTML=home();if(screen==='words')v.innerHTML=wordsPage();if(screen==='analysis')v.innerHTML=analysis();if(screen==='settings')v.innerHTML=settingsPage();if(screen==='study')v.innerHTML=studyPage();if(screen==='edit')v.innerHTML=editPage();if(screen==='import')v.innerHTML=importPage();if(screen==='backup')v.innerHTML=backupPage();if(screen==='done')v.innerHTML=donePage();bind();}function go(s){screen=s;render();window.scrollTo(0,0)}function home(){const d=due(),n=newWords(),left=Math.max(0,5-newToday()),last=state.settings.lastBackup;const warn=state.settings.reminder&&(!last||(Date.now()-new Date(last).getTime())>=7*DAY);return `<h2>今日の学習</h2>${warn?'<div class="notice">バックアップをおすすめします。<button class="btn secondary" data-go="backup">データ管理</button></div>':''}<div class="stats"><div class="card stat"><strong>${active().length}</strong><small>登録語数</small></div><div class="card stat"><strong>${countMastered()}</strong><small>習得済み</small></div><div class="card stat"><strong>${d.length}</strong><small>復習待ち</small></div></div><div class="card"><h3>復習</h3><p class="muted">期限が来た単語を苦手語から復習します。</p><button class="btn block" data-start="review" ${d.length?'':'disabled'}>復習を始める（${d.length}語）</button></div><div class="card"><h3>新規学習</h3><p class="muted">今日の残り ${left} / 5語 ・優先単語から出題</p><button class="btn block secondary" data-start="new" ${left&&n.length?'':'disabled'}>新しい単語を学ぶ</button></div>${session?'<button class="btn block ghost" data-resume>中断した学習を再開</button>':''}<div class="card"><h3>最近7日間の学習</h3>${chart()}</div>`}function chart(){let days=Array.from({length:7},(_,i)=>addDays(today(),i-6)),max=Math.max(1,...days.map(logCount));return `<div class="chart">${days.map(d=>`<div><i style="height:${Math.max(3,logCount(d)/max*92)}px"></i>${d.slice(5)}</div>`).join('')}</div>`}
function wordsPage(){return `<div class="row"><h2>単語帳</h2><button class="btn" data-go="edit">＋ 追加</button></div><input id="search" placeholder="英語・日本語で検索"><select id="filter"><option value="all">すべて</option><option value="new">未学習</option><option value="learning">学習中</option><option value="weak">苦手</option><option value="mastered">習得済み</option><option value="archive">アーカイブ</option></select><div id="wordlist"></div><button class="btn secondary block" data-go="import">JSONで一括登録</button>`}function refreshWords(){const q=($('#search')?.value||'').toLowerCase(),f=$('#filter')?.value||'all';let words=state.words.filter(w=>(w.term+' '+w.meaning).toLowerCase().includes(q)&& (f==='archive'?w.archived:!w.archived&&(f==='all'||(f==='new'&&!w.started)||(f==='learning'&&w.started&&!mastered(w)&&w.stage>0)||(f==='weak'&&w.started&&w.stage===0)||(f==='mastered'&&mastered(w)))));$('#wordlist').innerHTML=words.length?words.map(w=>`<div class="list-item row"><div class="grow"><strong>${esc(w.term)}</strong> <span class="pill">${esc(w.priority)}</span><div class="muted small">${esc(w.meaning)} · ${w.archived?'アーカイブ':mastered(w)?'習得済み':w.started?'学習中':'未学習'}</div></div><button class="btn secondary" data-edit="${esc(w.id)}">詳細</button></div>`).join(''):'<p class="muted">該当する単語はありません。</p>'}function analysis(){let total=active().length,done=countMastered(),todayCount=logCount(today()),first=state.logs.filter(l=>l.kind==='initial'),rate=first.length?Math.round(first.filter(l=>l.grade==='覚えた').length/first.length*100):0;let weak=active().filter(w=>w.started&&w.stage===0).length,learning=active().filter(w=>w.started&&!mastered(w)&&w.stage>0).length;return `<h2>学習分析</h2><div class="stats"><div class="card stat"><strong>${total}</strong><small>登録語数</small></div><div class="card stat"><strong>${done}</strong><small>習得済み</small></div><div class="card stat"><strong>${todayCount}</strong><small>今日の学習語</small></div></div><div class="card"><h3>初回「覚えた」率</h3><div class="word">${rate}%</div><p class="muted small">初回評価 ${first.length}件を集計。同日再出題は含みません。</p><div class="bar"><i style="width:${rate}%"></i></div></div><div class="card"><h3>直近7日の学習語数</h3>${chart()}</div><div class="card"><h3>現在の習得状況</h3><p>習得済み ${done}語 / 学習中 ${learning}語 / 苦手 ${weak}語 / 未学習 ${active().filter(w=>!w.started).length}語</p></div><div class="card"><h3>復習予定</h3><p>今日以前：${due().length}語</p><p>明日：${active().filter(w=>w.started&&w.due===addDays(today(),1)).length}語</p><p>7日以内：${active().filter(w=>w.started&&w.due>today()&&w.due<=addDays(today(),7)).length}語</p></div>`}
function settingsPage(){return `<h2>設定</h2><div class="card"><h3>評価後の動作</h3><label><input type="radio" name="advance" value="instant" class="toggle" ${state.settings.advance==='instant'?'checked':''}> すぐ次へ（初期値）</label><label><input type="radio" name="advance" value="delay" class="toggle" ${state.settings.advance==='delay'?'checked':''}> 1秒後に次へ</label><label><input type="radio" name="advance" value="manual" class="toggle" ${state.settings.advance==='manual'?'checked':''}> 「次へ」ボタンで進む</label></div><div class="card"><h3>学習ルール</h3><p class="muted">新規5語/日・復習無制限・間隔 1→3→7→14→30日</p></div><div class="card"><h3>データ管理</h3><label><input id="reminder" type="checkbox" class="toggle" ${state.settings.reminder?'checked':''}> 7日ごとのバックアップ案内を表示</label><button class="btn block secondary" data-go="backup">バックアップ・復元</button></div><div class="card"><h3>アプリについて</h3><p class="muted">VOCLOOP v1.0 / 端末内保存</p></div>`}
const fields=[['term','英単語・熟語'],['meaning','日本語の意味'],['katakana','カタカナ発音'],['stress','アクセント（強勢のある音節など）'],['pos','品詞'],['example','英語例文'],['translation','例文の和訳'],['usage','使い方・類義語との違い']];function editPage(){let w=editing?state.words.find(x=>x.id===editing):null;return `<div class="row"><h2>${w?'単語の詳細・編集':'単語を追加'}</h2><button class="btn secondary" data-go="words">戻る</button></div><form id="wordform" class="card">${fields.map(([key,label])=>`<label>${label}<input required name="${key}" value="${esc(w?.[key]||'')}" placeholder="${label}"></label>`).join('')}<label>優先度<select name="priority"><option ${w?.priority==='優先'?'selected':''}>優先</option><option ${w?.priority!=='優先'?'selected':''}>通常</option></select></label><button class="btn block" type="submit">${w?'変更を保存':'単語を登録'}</button></form>${w?`<div class="card"><p>復習予定：${esc(w.due||'未学習')} / 段階：${w.stage}</p><button class="btn secondary block" data-archive="${esc(w.id)}">${w.archived?'アーカイブ解除':'アーカイブ'}</button><button class="btn danger block" data-delete="${esc(w.id)}">完全削除</button></div>`:''}`}
function importPage(){return `<div class="row"><h2>JSON一括登録</h2><button class="btn secondary" data-go="words">戻る</button></div><div class="card"><p class="muted small">形式：{ "words": [{ "term": "...", "meaning": "...", "katakana": "...", "stress": "...", "pos": "...", "example": "...", "translation": "...", "usage": "...", "priority": "優先" }] }</p><textarea id="jsoninput" placeholder="JSONを貼り付け"></textarea><button class="btn block" id="validate">内容を検証する</button></div><div id="importresult"></div>`}function backupPage(){return `<div class="row"><h2>バックアップ・復元</h2><button class="btn secondary" data-go="settings">戻る</button></div><div class="card"><h3>バックアップ</h3><p class="muted">単語・履歴・復習予定・設定をJSONで保存します。</p><button class="btn block" id="export">JSONを書き出す</button><p class="muted small">最終バックアップ：${esc(state.settings.lastBackup||'未実施')}</p></div><div class="card"><h3>復元</h3><p class="muted">既存データは全件置き換わります。先に現在のバックアップを保存してください。</p><input type="file" id="restorefile" accept="application/json,.json"><div id="restoreinfo"></div></div>`}
function studyPage(){if(!session)return '<p>学習セッションがありません。</p>';const w=state.words.find(x=>x.id===session.queue[session.index]);if(!w)return `<h2>学習完了</h2><button class="btn" data-go="home">ホームへ</button>`;return `<div class="row"><h2>${session.type==='new'?'新規学習':'復習'}</h2><button class="btn secondary" id="pause">中断</button></div><p class="muted">${session.index+1} / ${session.queue.length} 語</p><div class="card flip" id="flip">${flipped?`<div class="word">${esc(w.term)}</div><div class="meaning">${esc(w.meaning)}</div><div>${esc(w.katakana)} ・ ${esc(w.stress)} ・ ${esc(w.pos)}</div><div>${esc(w.example)}</div><div class="muted">${esc(w.translation)}</div><div class="muted small">${esc(w.usage)}</div>`:`<div class="word">${esc(w.term)}</div><p class="muted">カードをタップして答えを見る</p>`}</div>${flipped?`<div class="btnrow"><button class="btn danger" data-grade="覚えていない">覚えていない</button><button class="btn secondary" data-grade="迷った">迷った</button><button class="btn" data-grade="覚えた">覚えた</button></div>`:''}${session.pending?'<button class="btn block" id="next">次へ</button>':''}${lastUndo?'<button class="btn ghost block" id="undo">直前の評価を取り消す</button>':''}`}
function donePage(){return `<h2>学習完了！</h2><div class="card"><p>今回のセッションを終了しました。</p><p class="muted">学習履歴は保存されています。</p></div><button class="btn block" data-go="home">ホームに戻る</button>`}
async function start(type){let queue;if(type==='review')queue=due().map(w=>w.id);else queue=newWords().slice(0,Math.max(0,5-newToday())).map(w=>w.id);if(!queue.length)return;session={type,queue,index:0,pending:false,retried:[]};state.session=session;lastUndo=null;flipped=false;await save();go('study')}
async function grade(g){if(!session||session.pending)return;let w=state.words.find(x=>x.id===session.queue[session.index]);if(!w)return;const backup=structuredClone({word:w,logs:state.logs,session});const isNew=!w.started;const retry=session.retried.includes(w.id);if(!retry){w.started=true;w.lastGrade=g;w.lastDate=today();if(g==='覚えた'){w.stage=Math.min(5,(w.stage||0)+1);w.streak=(w.streak||0)+1;w.due=addDays(today(),[0,1,3,7,14,30][w.stage]);if(w.streak>=3&&w.stage>=3)w.mastered=true}else if(g==='迷った'){w.streak=0;w.due=addDays(today(),1)}else{w.stage=0;w.streak=0;w.mastered=false;w.due=addDays(today(),1);if(!session.queue.slice(session.index+1).includes(w.id))session.queue.push(w.id)} }state.logs.push({id:id(),wordId:w.id,date:today(),at:new Date().toISOString(),kind:retry?'retry':'initial',isNew,grade:g});lastUndo=backup;session.pending=true;state.session=session;try{await save()}catch(e){Object.assign(w,backup.word);state.logs=backup.logs;session=backup.session;alert('保存できませんでした。'+e.message);return}if(state.settings.advance==='manual')render();else if(state.settings.advance==='delay'){render();setTimeout(()=>{if(session?.pending)next()},1000)}else await next()}
async function next(){if(!session?.pending)return;let wId=session.queue[session.index];if(state.logs.at(-1)?.wordId===wId&&state.logs.at(-1)?.grade==='覚えていない'&&!session.retried.includes(wId))session.retried.push(wId);session.pending=false;session.index++;flipped=false;state.session=session.index<session.queue.length?session:null;let finished=!state.session;if(finished)session=null;await save();go(finished?'done':'study')}
async function undo(){if(!lastUndo)return;let snap=lastUndo;let ix=state.words.findIndex(w=>w.id===snap.word.id);if(ix<0)return;state.words[ix]=snap.word;state.logs=snap.logs;session=snap.session;session.pending=false;state.session=session;lastUndo=null;flipped=true;await save();render()}
function normalize(raw){if(!raw||typeof raw!=='object')throw Error('単語データが不正です');let o={};for(const [k,label] of fields){if(typeof raw[k]!=='string'||!raw[k].trim())throw Error(label+'が不足しています');o[k]=raw[k].trim()}o.priority=raw.priority==='優先'?'優先':'通常';return o}function validateImport(text){let obj=JSON.parse(text);if(!Array.isArray(obj.words))throw Error('words配列がありません');let good=[],bad=[];obj.words.forEach((w,i)=>{try{let n=normalize(w);let match=state.words.find(x=>x.term.toLowerCase()===n.term.toLowerCase()&&x.pos===n.pos&&x.meaning===n.meaning);good.push({...n,match:match?.id||null})}catch(e){bad.push(`${i+1}件目：${e.message}`)}});return {good,bad}}
function bind(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{editing=null;go(b.dataset.nav)});document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{editing=null;go(b.dataset.go)});document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start(b.dataset.start));if($('#search')){$('#search').oninput=refreshWords;$('#filter').onchange=refreshWords;refreshWords()}document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=b.dataset.edit;go('edit')});if($('#wordform'))$('#wordform').onsubmit=async e=>{e.preventDefault();let raw=Object.fromEntries(new FormData(e.target));let w=normalize(raw);if(editing){let old=state.words.find(x=>x.id===editing);Object.assign(old,w)}else{state.words.push({...w,id:id(),created:new Date().toISOString(),started:false,stage:0,streak:0,mastered:false,due:null,archived:false})}await save();editing=null;go('words')};document.querySelectorAll('[data-archive]').forEach(b=>b.onclick=async()=>{let w=state.words.find(x=>x.id===b.dataset.archive);w.archived=!w.archived;await save();go('words')});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('単語と関連する学習履歴を完全に削除しますか？'))return;let wid=b.dataset.delete;state.words=state.words.filter(w=>w.id!==wid);state.logs=state.logs.filter(l=>l.wordId!==wid);await save();go('words')});document.querySelectorAll('input[name=advance]').forEach(b=>b.onchange=async()=>{state.settings.advance=b.value;await save()});if($('#reminder'))$('#reminder').onchange=async e=>{state.settings.reminder=e.target.checked;await save()};if($('#flip'))$('#flip').onclick=()=>{flipped=!flipped;render()};document.querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>grade(b.dataset.grade));if($('#pause'))$('#pause').onclick=()=>go('home');if($('#next'))$('#next').onclick=next;if($('#undo'))$('#undo').onclick=undo;if(document.querySelector('[data-resume]'))document.querySelector('[data-resume]').onclick=()=>{flipped=false;go('study')};if($('#validate'))$('#validate').onclick=()=>{try{importDraft=validateImport($('#jsoninput').value);$('#importresult').innerHTML=`<div class="card"><h3>検証結果</h3><p class="ok">登録可能：${importDraft.good.length}語</p><p>既存カードと一致：${importDraft.good.filter(w=>w.match).length}語（更新時も履歴を維持）</p><p class="error">${esc(importDraft.bad.join('\n'))}</p><button class="btn block" id="commitimport" ${importDraft.good.length?'':'disabled'}>確認して登録</button></div>`;$('#commitimport').onclick=async()=>{if(!confirm(`${importDraft.good.length}語を登録します。既存の一致カードは内容を更新し、学習履歴は維持します。よろしいですか？`))return;for(let w of importDraft.good){let match=w.match;delete w.match;if(match){Object.assign(state.words.find(x=>x.id===match),w)}else state.words.push({...w,id:id(),created:new Date().toISOString(),started:false,stage:0,streak:0,mastered:false,due:null,archived:false})}await save();importDraft=null;alert('登録しました');go('words')}}catch(e){$('#importresult').innerHTML=`<p class="error">${esc(e.message)}</p>`}};if($('#export'))$('#export').onclick=async()=>{const snapshot=structuredClone(state);snapshot.settings.lastBackup=new Date().toISOString();let blob=new Blob([JSON.stringify({format:'VOCLOOP_BACKUP',version:1,exportedAt:new Date().toISOString(),data:snapshot},null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='VOCLOOP-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);state.settings.lastBackup=snapshot.settings.lastBackup;await save();render()};if($('#restorefile'))$('#restorefile').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(obj.format!=='VOCLOOP_BACKUP'||obj.version!==1||!obj.data||!Array.isArray(obj.data.words)||!Array.isArray(obj.data.logs)||!obj.data.settings)throw Error('対応するVOCLOOPバックアップではありません');for(const w of obj.data.words){normalize(w);if(typeof w.id!=='string'||typeof w.stage!=='number')throw Error('単語データが不正です')}for(const l of obj.data.logs)if(!l||typeof l.wordId!=='string'||typeof l.date!=='string')throw Error('履歴データが不正です');if(!confirm(`${obj.data.words.length}語・${obj.data.logs.length}件の履歴を復元します。現在のデータはすべて置き換わります。現在のバックアップは保存しましたか？`))return;let previous=state;state=obj.data;try{await save()}catch(err){state=previous;throw err}session=state.session||null;lastUndo=null;alert('復元しました');go('home')}catch(err){alert('復元を中止しました：'+err.message)}}}
init().catch(e=>{$('#view').innerHTML='<p class="error">データベースを開けません：'+esc(e.message)+'</p>'});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
